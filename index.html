<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Hub</title><style>
:root{--bg:#090b0e;--card:#15191f;--text:#f5f7f9;--muted:#9aa5b1;--accent:#91e866;--line:#2b333d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#080a0d,#10141a);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 15px 90px}.hidden{display:none!important}

.weekgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.week,.day,.exercise,.panel{background:#15191f;border:1px solid var(--line);border-radius:20px}.week{padding:20px;min-height:145px;cursor:pointer}.week h2{font-size:28px;margin:5px 0}.day{padding:18px;margin:10px 0;cursor:pointer}.day h3{margin:4px 0}.topbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.back{background:#242a32;color:#fff;border:0;border-radius:12px;padding:11px 13px}.title{font-size:27px;font-weight:950}.deleteweek{margin-top:15px;background:#25171a;color:#ff9ba3;border:1px solid #5b3438;border-radius:10px;padding:9px;font-weight:900}
.panel{padding:15px;margin-bottom:14px}.stats{display:flex;justify-content:space-between}.stat span{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase}.stat b{display:block;font-size:21px}.barbg{height:9px;background:#262c34;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent)}
.exercise{padding:16px;margin:11px 0}.exhead{display:flex;align-items:center;gap:10px}.emoji{font-size:30px}.exname{font-size:19px;font-weight:950}.weight{margin:12px 0}.weight label{display:block;color:var(--muted);font-size:10px;font-weight:900}.weight input{width:100%;padding:10px;background:#0e1115;color:white;border:1px solid #303944;border-radius:10px;font-size:16px}
.set{background:#0f1216;border:1px solid #29313a;border-radius:14px;padding:11px;margin:9px 0}.settop{display:flex;justify-content:space-between;align-items:center;font-weight:900}.setdone{color:var(--accent)}
.reps{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.rep{width:34px;height:34px;border-radius:9px;border:1px solid #3b4550;background:#20262d;color:#fff;font-weight:900}.rep.on{background:var(--accent);color:#10150d;border-color:var(--accent)}
.timer{margin-top:10px;padding:12px;border-radius:12px;background:#1d242b;border:1px solid #3a4651}.timer strong{font-size:24px}.timer .hint{font-size:11px;color:var(--muted)}.timer button{margin-top:8px;margin-right:5px;border:0;border-radius:9px;padding:8px 10px;font-weight:900}.green{background:var(--accent)}.dark{background:#303842;color:#fff}
.addbtn,.alldone{width:100%;padding:15px;border-radius:15px;font-weight:950;margin-top:10px}.addbtn{background:#15191f;color:var(--accent);border:1px dashed #4b5662}.alldone{background:var(--accent);border:0;color:#10150d;font-size:17px}
@media(max-width:560px){.weekgrid{grid-template-columns:1fr}h1{font-size:42px}}

.setcheck{width:100%;margin-top:10px;padding:13px;border-radius:11px;border:1px solid #3b4550;background:#20262d;color:white;font-weight:950;font-size:15px;cursor:pointer}

.reststate{margin-top:8px;font-size:12px;font-weight:900;color:#ffbf69}.reststate.ready{color:var(--accent)}

.completedset{border-color:#70c94b!important;background:linear-gradient(145deg,#172119,#101813)!important;box-shadow:0 0 0 1px #91e86622,0 10px 28px #0004}

.timer{background:linear-gradient(145deg,#1c242b,#182027)!important;box-shadow:inset 0 1px 0 #ffffff0b}

.compactdone .settop{font-size:15px}.compactdone .setdone{font-size:14px;color:var(--accent)}
.completedExerciseSummary{padding:2px}.completedExerciseSummary .exhead{align-items:center}.exerciseTick{margin-left:auto;color:var(--accent);font-size:12px;font-weight:1000;white-space:nowrap}
.compactmeta{margin:8px 0 0 50px;color:var(--muted);font-size:13px;font-weight:800}
.viewsets{margin:10px 0 0 50px;border:0;background:#223025;color:#aef88a;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:900}
.exercise.exercisecomplete{padding:14px 16px!important}

.restingSet{border-color:#46515d!important;background:linear-gradient(145deg,#151b21,#101419)!important}
.inlineTimer{display:flex;align-items:baseline;gap:10px;margin:10px 0}.inlineTimer strong{font-size:28px}.inlineTimer span{color:var(--muted);font-size:12px;font-weight:800}
.restbadge{font-size:11px;color:#ffbd6a}.readycheck{background:linear-gradient(135deg,#9af06d,#79d84d)!important;color:#10150d!important;border-color:#79d84d!important}

.restActions{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin-top:12px}
.restActions button{padding:13px;border-radius:11px;font-size:15px;font-weight:950;cursor:pointer}
.skipRest{background:#252c34;color:#c2cad3;border:1px solid #3a444e}
.doneRest{background:#2d3930;color:#baf59f;border:1px solid #4d674f}
.doneRest.readyDone{background:linear-gradient(135deg,#9af06d,#79d84d);color:#10150d;border-color:#79d84d}

.restActions.three{grid-template-columns:1fr 1fr 1.35fr}
.resetRest{background:#20272e;color:#d5dbe1;border:1px solid #3a444e}
@media(max-width:420px){.restActions.three{grid-template-columns:1fr 1fr 1.3fr}.restActions.three button{padding:12px 6px;font-size:13px}}

.lastweek{margin-top:7px;color:var(--muted);font-size:12px;font-weight:850}
.buildTimer{margin-bottom:16px;background:linear-gradient(145deg,#171d23,#11161b)!important}
.buildHead{display:flex;align-items:center;justify-content:space-between}.buildHead strong{font-size:34px}.buildMax{color:var(--muted);font-size:12px;font-weight:950}
.buildBar{height:8px;background:#252d35;border-radius:99px;overflow:hidden;margin:10px 0}.buildBar div{height:100%;width:0;background:var(--accent);transition:.25s}
.buildActions{display:grid;grid-template-columns:2fr 1fr;gap:8px}.buildActions button{border:0;border-radius:10px;padding:10px;font-weight:950}.buildActions button:first-child{background:var(--accent);color:#10150d}.buildActions button:last-child{background:#283039;color:#fff}

.lastweek{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lastweek b{font-size:11px;padding:4px 7px;border-radius:999px}
.lastweek .gain{background:#20351f;color:#aaf58a;border:1px solid #3f6538}
.lastweek .drop{background:#352122;color:#ffaaaa;border:1px solid #633b3d}
.lastweek .same{background:#252c33;color:#c0c8d0;border:1px solid #3a444e}
.workoutTimers{position:sticky;top:8px;z-index:20;background:linear-gradient(145deg,#182019,#111712)!important;border-color:#3b5236!important;box-shadow:0 12px 35px #0008}.timerTitleRow{display:flex;justify-content:space-between;align-items:center}.timerTitleRow strong{font-size:36px}.timerTitleRow button{border:0;border-radius:11px;background:var(--accent);color:#10150d;padding:11px 18px;font-weight:1000}.timerSplit{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.timerSplit div{background:#0f1410;border:1px solid #293529;border-radius:11px;padding:9px}.timerSplit span{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.timerSplit b{font-size:17px}.sessionActions{display:grid;grid-template-columns:2fr 1fr;gap:7px;margin-top:9px}.sessionActions button{border:0;border-radius:9px;padding:9px;font-weight:900;background:#263028;color:#e9f3e6}.sessionActions button:last-child{background:#292f35;color:#cbd2d8}
.prbadge{display:inline-block;font-size:10px;color:#17130a;background:linear-gradient(135deg,#f6d76b,#d9ae36);padding:4px 7px;border-radius:999px;vertical-align:middle;margin-left:5px;white-space:nowrap}
.finishOverlay{position:fixed;inset:0;background:#050706e8;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.finishCard{width:min(440px,100%);background:linear-gradient(160deg,#18231a,#111713);border:1px solid #48603f;border-radius:24px;padding:25px;text-align:center;box-shadow:0 30px 80px #000b}
.finishCheck{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#10150d;font-size:32px;font-weight:1000}.finishCard h2{margin:8px 0 18px}
.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summaryGrid div{background:#0d120e;border:1px solid #29362a;border-radius:12px;padding:11px 5px}.summaryGrid span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:900}.summaryGrid b{font-size:18px}.prSummary{margin-top:12px;padding:11px;background:#2b2613;border:1px solid #5d5021;border-radius:11px;color:#f5dc80;font-weight:900;font-size:13px}.finishCard>button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#10150d;font-weight:1000}

.backupPanel{margin-top:18px;background:#11161b;border:1px solid #29323b;border-radius:18px;padding:15px}.migrationMsg{color:var(--muted);font-size:12px;margin:7px 0 11px}.backupBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.backupBtns button,.backupBtns label{display:grid;place-items:center;padding:12px;border-radius:11px;font-weight:950;font-size:13px;cursor:pointer}.backupBtns button{background:var(--accent);color:#10150d;border:0}.backupBtns label{background:#252d35;color:#fff;border:1px solid #3b4651}.backupBtns input{display:none}

.day{position:relative;overflow:hidden;transition:transform .18s ease,border-color .2s ease,background .2s ease}
.dayComplete{border-color:#70d44d!important;background:linear-gradient(135deg,#162319 0%,#101812 70%)!important;box-shadow:0 0 0 1px #91e86620,0 14px 35px #0005,inset 0 1px 0 #b8ff9a12}
.dayComplete:before{content:"";position:absolute;inset:-60% 35% auto -20%;height:180px;background:radial-gradient(circle,#91e86614,transparent 68%);pointer-events:none}
.dayComplete .eyebrow{color:#a8f782!important}.dayComplete h3{color:#efffe8}
.completeGlow{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:5px 9px;border-radius:999px;background:#20391f;border:1px solid #4d7b43;color:#b9ff9b;font-size:10px;font-weight:1000;letter-spacing:.8px}
.completeGlow span{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#10200c;font-size:11px}
.dayTitleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.dayTitleRow h3{margin:4px 0}
.bigTick{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(135deg,#9af06d,#72d248);color:#10200c;font-size:23px;font-weight:1000;box-shadow:0 0 20px #91e86630}
.completeMeta{margin-top:7px;color:#a9c99d;font-size:13px;font-weight:850}
</style></head><body><div class="wrap">
<section id="home"><div class="eyebrow">YOUR TRAINING DASHBOARD</div><h1>GYM HUB</h1><p class="muted">Choose a week or add your next training week.</p><div class="weekgrid" id="weeks"></div><div class="backupPanel"><div class="eyebrow">DATA & BACKUP</div><div id="migrationMsg" class="migrationMsg"></div><div class="backupBtns"><button onclick="exportBackup()">Export Backup</button><label>Import Backup<input id="backupInput" type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></label></div></div></section>
<section id="weekPage" class="hidden"><div class="topbar"><button class="back" onclick="home()">← Home</button><div class="title" id="weekTitle"></div></div><div id="days"></div></section>
<section id="dayPage" class="hidden"><div class="topbar"><button class="back" onclick="openWeek(currentWeek)">← Week</button><div class="title" id="dayTitle"></div></div><div class="workoutTimers panel"><div class="timerTitleRow"><div><div class="eyebrow">SESSION TIMER</div><strong id="totalWorkoutTime">0:00</strong></div><button id="sessionStartBtn" onclick="toggleSessionTimer()">Start</button></div><div class="timerSplit"><div><span>Total workout</span><b id="totalWorkoutSmall">0:00</b></div><div><span>Total rest</span><b id="totalRestTime">0:00</b></div><div><span>Active time</span><b id="activeWorkoutTime">0:00</b></div></div><div class="sessionActions"><button onclick="toggleSessionTimer()">Start / Pause</button><button onclick="resetSessionTimer()">Reset</button></div></div><div class="panel"><div class="stats"><div class="stat"><span>Exercises</span><b id="cs">0 / 0</b></div><div class="stat"><span>Progress</span><b id="ps">0%</b></div></div><div class="barbg"><div class="bar" id="bar"></div></div></div><div id="exercises"></div><button class="alldone" id="allDoneBtn" onclick="allDone()">✓ ALL DONE</button><div id="finishSummary" class="finishOverlay hidden"></div></section>
</div><script>
const KEY="gymhub-v6";
function ex(name,sets,reps,weight=""){return{name,sets,reps,weight,done:false,tallies:Array.from({length:sets},()=>Array(reps).fill(false))}}
function template(){
return[
{day:"Tuesday",name:"Leg Power",exercises:[ex("Barbell Squat",5,5,60),ex("Hip Thrust",5,5),ex("Deadlift",5,5),ex("Bulgarian Split Squat",5,5)]},
{day:"Wednesday",name:"Chest, Triceps & Shoulders",exercises:[ex("Bench Press",5,10),ex("Triceps Extension",5,10),ex("Cable Triceps Extension (Rope)",5,12),ex("Dumbbell Fly",5,12)]},
{day:"Thursday",name:"Arms & Shoulders",exercises:[]}
]}
function migrateOldGymData(){
 const keys=["gymhub-v6","allen-gym-hub-v2","gymhub-w1-tue-legpower-v1"];
 let best=null,bestScore=-1,source="";
 keys.forEach(k=>{
   try{
     let raw=localStorage.getItem(k);if(!raw)return;
     let obj=JSON.parse(raw),score=0;
     if(obj&&Array.isArray(obj.weeks)){
       obj.weeks.forEach(w=>w.days&&w.days.forEach(d=>d.exercises&&d.exercises.forEach(e=>{score+=1;if(e.weight!==""&&e.weight!=null)score+=2;if(e.done)score+=1})));
     } else if(Array.isArray(obj)) score=obj.length;
     if(score>bestScore){best=obj;bestScore=score;source=k}
   }catch(e){}
 });
 if(!best)return null;
 if(Array.isArray(best)){ // earliest single Tuesday workout format
   let days=template();
   days[0].exercises.forEach((e,i)=>{let o=best[i];if(o){e.weight=o.weight??e.weight;e.done=!!o.done;if(e.done)e.tallies=e.tallies.map(s=>s.map(()=>true))}});
   best={weeks:[{number:1,days}]};
 }
 // normalize all old exercises to current tally structure
 if(best.weeks)best.weeks.forEach(w=>{
   let fresh=template();
   ["Tuesday","Wednesday","Thursday"].forEach(dayName=>{
     let d=w.days?.find(x=>x.day===dayName);
     if(!d){w.days=w.days||[];w.days.push(fresh.find(x=>x.day===dayName));return}
     // fill missing standard exercises for Tue/Wed
     let fd=fresh.find(x=>x.day===dayName);
     fd.exercises.forEach(fe=>{
       let e=d.exercises?.find(x=>x.name===fe.name);
       if(!e){d.exercises=d.exercises||[];d.exercises.push(fe);return}
       e.sets=Number(e.sets)||fe.sets;e.reps=Number(e.reps)||fe.reps;
       if(!Array.isArray(e.tallies)||e.tallies.length!==e.sets)e.tallies=Array.from({length:e.sets},()=>Array(e.reps).fill(!!e.done));
     });
   });
 });
 localStorage.setItem("gymhub-migration-source",source);
 return best;
}
let data=JSON.parse(localStorage.getItem(KEY)||"null")||migrateOldGymData()||{weeks:[{number:1,days:template()}]};
localStorage.setItem(KEY,JSON.stringify(data));
let currentWeek=1,currentDay=0,timers={};
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const SESSION_KEY="gymhub-session-v18";
let session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null")||{running:false,start:0,elapsed:0,restAccum:0,restStart:null};
function saveSession(){localStorage.setItem(SESSION_KEY,JSON.stringify(session))}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`}
function toggleSessionTimer(){if(session.running){session.elapsed+=Date.now()-session.start;session.running=false}else{session.start=Date.now();session.running=true}saveSession();updateSessionTimer()}
function resetSessionTimer(){session={running:false,start:0,elapsed:0,restAccum:0,restStart:null};saveSession();updateSessionTimer()}
function updateSessionTimer(){let total=session.elapsed+(session.running?Date.now()-session.start:0);let rest=session.restAccum+(session.restStart!==null?Date.now()-session.restStart:0);rest=Math.min(rest,total);let active=Math.max(0,total-rest);let vals=[["totalWorkoutTime",total],["totalWorkoutSmall",total],["totalRestTime",rest],["activeWorkoutTime",active]];vals.forEach(([id,ms])=>{let e=document.getElementById(id);if(e)e.textContent=fmt(ms/1000)});let b=document.getElementById("sessionStartBtn");if(b)b.textContent=session.running?"Pause":"Start"}
let build={running:false,start:0,elapsed:0};
function toggleBuild(){if(build.running){build.elapsed+=Date.now()-build.start;build.running=false}else if(build.elapsed<300000){build.start=Date.now();build.running=true}updateBuild()}
function resetBuild(){build={running:false,start:0,elapsed:0};updateBuild()}
function updateBuild(){let ms=build.elapsed+(build.running?Date.now()-build.start:0);ms=Math.min(ms,300000);if(ms>=300000)build.running=false;let sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60;let t=document.getElementById("buildTime");if(t)t.textContent=`${m}:${String(s).padStart(2,"0")}`;let f=document.getElementById("buildFill");if(f)f.style.width=(ms/300000*100)+"%";let b=document.getElementById("buildBtn");if(b)b.textContent=build.running?"Pause":(ms>=300000?"Max reached":"Start")}
setInterval(updateBuild,250);
function show(id){["home","weekPage","dayPage"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function home(){setInterval(updateSessionTimer,250);
renderWeeks();show("home")}
function renderWeeks(){let e=document.getElementById("weeks");e.innerHTML="";data.weeks.forEach(w=>{let c=document.createElement("div");c.className="week";c.onclick=()=>openWeek(w.number);c.innerHTML=`<div class="eyebrow">TRAINING</div><h2>Week ${w.number}</h2><div class="muted">3 workout days →</div><button class="deleteweek" onclick="event.stopPropagation();deleteWeek(${w.number})">Delete Week</button>`;e.appendChild(c)});let a=document.createElement("div");a.className="week";a.onclick=addWeek;a.innerHTML=`<div style="font-size:38px;color:var(--accent)">＋</div><h2>Add Week</h2><div class="muted">Same workout plan, fresh tracking</div>`;e.appendChild(a)}
function deleteWeek(n){if(!confirm(`Delete Week ${n} and all its workout data?`))return;if(!confirm(`Are you REALLY sure? Week ${n} cannot be recovered.`))return;data.weeks=data.weeks.filter(w=>w.number!==n);save();renderWeeks()}
function addWeek(){let n=data.weeks.length?Math.max(...data.weeks.map(w=>w.number))+1:1;data.weeks.push({number:n,days:template()});save();openWeek(n)}
function openWeek(n){currentWeek=n;let w=data.weeks.find(x=>x.number===n);document.getElementById("weekTitle").textContent=`Week ${n}`;let e=document.getElementById("days");e.innerHTML="";w.days.forEach((d,i)=>{let done=d.exercises.filter(x=>x.done).length;c=document.createElement("div");let full=d.exercises.length>0&&done===d.exercises.length;c.className="day"+(full?" dayComplete":"");c.onclick=()=>openDay(i);c.innerHTML=full?`<div class="completeGlow"><span>✓</span> WORKOUT COMPLETE</div><div class="eyebrow">${d.day.toUpperCase()}</div><div class="dayTitleRow"><h3>${d.name}</h3><div class="bigTick">✓</div></div><div class="completeMeta">${done} / ${d.exercises.length} exercises • DONE</div>`:`<div class="eyebrow">${d.day.toUpperCase()}</div><h3>${d.name}</h3><div class="muted">${d.exercises.length?done+" / "+d.exercises.length+" exercises complete":"Exercises to be added"} →</div>`;e.appendChild(c)});show("weekPage")}
function getDay(){return data.weeks.find(x=>x.number===currentWeek).days[currentDay]}
function openDay(i){currentDay=i;renderDay();show("dayPage")}
function icon(n){n=n.toLowerCase();if(n.includes("squat"))return"🏋️";if(n.includes("thrust"))return"🍑";if(n.includes("bench")||n.includes("fly"))return"🏋️";if(n.includes("tricep"))return"💪";return"💪"}
let pendingSet=null,pendingUntil=0;
let pendingAction="";
function toggleSet(ei,si){
 let x=getDay().exercises[ei],isDone=x.tallies[si].every(Boolean),id=`${currentWeek}-${currentDay}-${ei}-${si}`,now=Date.now();
 if(isDone){
   let token=id+"-undo";
   if(pendingAction!==token || now>pendingUntil){pendingAction=token;pendingUntil=now+3500;renderDay();return;}
   pendingAction="";pendingUntil=0;x.tallies[si]=x.tallies[si].map(()=>false);delete timers[id];x.done=false;save();renderDay();return;
 }
 if(!timers[id]){
   timers[id]={start:Date.now(),target:300};
   if(session.running&&session.restStart===null){session.restStart=Date.now();saveSession();}
   renderDay();return;
 }
 let elapsed=Math.floor((Date.now()-timers[id].start)/1000);
 if(elapsed<210)return;
 x.tallies[si]=x.tallies[si].map(()=>true);delete timers[id];
 if(session.restStart!==null){session.restAccum+=Date.now()-session.restStart;session.restStart=null;saveSession();}
 x.done=x.tallies.every(s=>s.every(Boolean));save();renderDay();
}
function toggleRep(ei,si,ri){let x=getDay().exercises[ei];x.tallies[si][ri]=!x.tallies[si][ri];let complete=x.tallies[si].every(Boolean);if(complete)startTimer(ei,si);x.done=x.tallies.every(s=>s.every(Boolean));save();renderDay()}
function startTimer(ei,si){let k=`${currentWeek}-${currentDay}-${ei}-${si}`;if(!timers[k])timers[k]={start:Date.now(),target:300};}
function timerHTML(ei,si){
 let k=`${currentWeek}-${currentDay}-${ei}-${si}`,t=timers[k];if(!t)return"";
 let elapsed=Math.floor((Date.now()-t.start)/1000),left=Math.max(0,300-elapsed),m=Math.floor(left/60),s=left%60;
 let minReached=elapsed>=90;
 return `<div class="timer"><div class="hint">MANDATORY REST • MINIMUM 3:30 • MAXIMUM 5:00</div><strong id="tm-${ei}-${si}">${m}:${String(s).padStart(2,"0")}</strong><div class="reststate ${minReached?"ready":""}" id="rs-${ei}-${si}">${minReached?"✓ Minimum rest reached":"Resting — minimum rest not reached"}</div></div>`
}
function setTimer(ei,si,target){let k=`${currentWeek}-${currentDay}-${ei}-${si}`;timers[k]={start:Date.now(),target};renderDay()}
function clearTimer(ei,si){delete timers[`${currentWeek}-${currentDay}-${ei}-${si}`];renderDay()}
setInterval(()=>{let rerender=false;document.querySelectorAll("[id^=tm-]").forEach(el=>{let [_,ei,si]=el.id.split("-"),k=`${currentWeek}-${currentDay}-${ei}-${si}`,t=timers[k];if(!t)return;let elapsed=Math.min(300,Math.floor((Date.now()-t.start)/1000));el.textContent=`${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}`;if(elapsed===210||elapsed===300)rerender=true;});if(rerender)renderDay()},1000);
let pendingRestAction="", pendingRestUntil=0;
function resetRest(ei,si){
 let id=`${currentWeek}-${currentDay}-${ei}-${si}-reset`,now=Date.now();
 if(pendingRestAction!==id||now>pendingRestUntil){pendingRestAction=id;pendingRestUntil=now+3000;renderDay();return;}
 pendingRestAction="";pendingRestUntil=0;
 delete timers[`${currentWeek}-${currentDay}-${ei}-${si}`];
 renderDay();
}
function skipRest(ei,si){
 let id=`${currentWeek}-${currentDay}-${ei}-${si}-skip`,now=Date.now();
 if(pendingRestAction!==id||now>pendingRestUntil){pendingRestAction=id;pendingRestUntil=now+3000;renderDay();return;}
 pendingRestAction="";pendingRestUntil=0;finishSetNow(ei,si);
}
function finishRestSet(ei,si){
 let id=`${currentWeek}-${currentDay}-${ei}-${si}-done`,now=Date.now();
 if(pendingRestAction!==id||now>pendingRestUntil){pendingRestAction=id;pendingRestUntil=now+3000;renderDay();return;}
 pendingRestAction="";pendingRestUntil=0;finishSetNow(ei,si);
}
function finishSetNow(ei,si){
 let x=getDay().exercises[ei],id=`${currentWeek}-${currentDay}-${ei}-${si}`;
 x.tallies[si]=x.tallies[si].map(()=>true);delete timers[id];
 if(session.restStart!==null){session.restAccum+=Date.now()-session.restStart;session.restStart=null;saveSession();}
 x.done=x.tallies.every(s=>s.every(Boolean));save();renderDay();
}
function isPR(name,currentWeight){
 let cur=Number(currentWeight);if(!currentWeight||Number.isNaN(cur))return false;
 let best=-Infinity;
 data.weeks.filter(w=>w.number<currentWeek).forEach(w=>{
   w.days.forEach(d=>d.exercises.forEach(e=>{if(e.name===name&&e.weight!=="")best=Math.max(best,Number(e.weight))}))
 });
 return best>-Infinity && cur>best;
}
function previousWeight(name,currentWeight=""){
 let prev=data.weeks.find(w=>w.number===currentWeek-1);
 if(!prev)return `<span>Last week: —</span>`;
 let d=prev.days[currentDay];if(!d)return `<span>Last week: —</span>`;
 let x=d.exercises.find(e=>e.name===name);
 if(!x||x.weight==="")return `<span>Last week: —</span>`;
 let old=Number(x.weight),cur=Number(currentWeight);
 if(currentWeight===""||Number.isNaN(cur))return `<span>Last week: ${old} kg</span>`;
 let diff=cur-old;
 if(diff>0)return `<span>Last week: ${old} kg</span><b class="gain">↑ +${diff} kg</b>`;
 if(diff<0)return `<span>Last week: ${old} kg</span><b class="drop">↓ ${diff} kg</b>`;
 return `<span>Last week: ${old} kg</span><b class="same">→ same</b>`;
}
function renderDay(){let d=getDay();document.getElementById("dayTitle").textContent=`${d.day} — ${d.name}`;let e=document.getElementById("exercises");e.innerHTML="";d.exercises.forEach((x,ei)=>{let c=document.createElement("div");c.className="exercise"+(x.done?" exercisecomplete":"");let sets=x.tallies.map((r,si)=>{let sd=r.every(Boolean);return sd
 ? `<div class="set completedset compactdone" onclick="toggleSet(${ei},${si})"><div class="settop"><span>Set ${si+1} • ${x.reps} reps</span><span class="setdone">${pendingAction===`${currentWeek}-${currentDay}-${ei}-${si}-undo`&&Date.now()<pendingUntil?"PRESS AGAIN TO UNDO":"✓ DONE"}</span></div></div>`
 : (()=>{let id=`${currentWeek}-${currentDay}-${ei}-${si}`,t=timers[id];if(!t)return `<div class="set"><div class="settop"><span>Set ${si+1} • ${x.reps} reps</span></div><button class="setcheck" onclick="toggleSet(${ei},${si})">Finished Set — Start Rest</button></div>`;let elapsed=Math.min(300,Math.floor((Date.now()-t.start)/1000)),ready=elapsed>=210;return `<div class="set restingSet"><div class="settop"><span>Set ${si+1} • ${x.reps} reps</span><span class="restbadge">${elapsed>=300?"MAX REST":ready?"MIN REST ✓":"RESTING"}</span></div><div class="inlineTimer"><strong id="tm-${ei}-${si}">${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,"0")}</strong><span>${ready?"Minimum 3:30 reached":"Build up to 3:30 minimum"} • max 5:00</span></div><div class="restActions three"><button class="resetRest" onclick="resetRest(${ei},${si})">${pendingRestAction===`${currentWeek}-${currentDay}-${ei}-${si}-reset`&&Date.now()<pendingRestUntil?"Reset again?":"↻ Reset"}</button><button class="skipRest" onclick="skipRest(${ei},${si})">${pendingRestAction===`${currentWeek}-${currentDay}-${ei}-${si}-skip`&&Date.now()<pendingRestUntil?"Skip again?":"Skip"}</button><button class="doneRest ${ready?"readyDone":""}" onclick="finishRestSet(${ei},${si})">${pendingRestAction===`${currentWeek}-${currentDay}-${ei}-${si}-done`&&Date.now()<pendingRestUntil?"Press again ✓":"✓ Done"}</button></div></div>`})()}).join("");
if(x.done){
 c.innerHTML=`<div class="completedExerciseSummary"><div class="exhead"><div class="emoji">${icon(x.name)}</div><div class="exname">${x.name} ${isPR(x.name,x.weight)?`<span class="prbadge">🏆 NEW PR</span>`:""}</div><div class="exerciseTick">✓ COMPLETE</div></div><div class="compactmeta">${x.sets} sets × ${x.reps} reps${x.weight!==""?` • ${x.weight} kg`:""}</div><button class="viewsets" onclick="this.parentElement.nextElementSibling.classList.toggle('hidden')">View / edit sets</button></div><div class="hidden">${sets}</div>`;
}else{
 c.innerHTML=`<div class="exhead"><div class="emoji">${icon(x.name)}</div><div class="exname">${x.name} ${isPR(x.name,x.weight)?`<span class="prbadge">🏆 NEW PR</span>`:""}</div></div><div class="weight"><label>WEIGHT KG</label><input type="number" step=".5" value="${x.weight}" placeholder="—" onchange="getDay().exercises[${ei}].weight=this.value;save();renderDay()"><div class="lastweek">${previousWeight(x.name,x.weight)}</div></div>${sets}`;
}
e.appendChild(c)});let done=d.exercises.filter(x=>x.done).length,total=d.exercises.length,p=total?Math.round(done/total*100):0;document.getElementById("cs").textContent=`${done} / ${total}`;document.getElementById("ps").textContent=p+"%";document.getElementById("bar").style.width=p+"%"}
let allDonePending=false,allDoneUntil=0;
function allDone(){
 let now=Date.now(),btn=document.getElementById("allDoneBtn");
 if(!allDonePending||now>allDoneUntil){allDonePending=true;allDoneUntil=now+3500;if(btn)btn.textContent="PRESS AGAIN TO FINISH";return}
 allDonePending=false;
 let d=getDay();d.exercises.forEach(x=>{x.tallies=x.tallies.map(s=>s.map(()=>true));x.done=true});save();
 showFinishSummary();
}
function showFinishSummary(){
 let d=getDay(),total=session.elapsed+(session.running?Date.now()-session.start:0),rest=session.restAccum+(session.restStart!==null?Date.now()-session.restStart:0),active=Math.max(0,total-rest);
 let prs=d.exercises.filter(x=>isPR(x.name,x.weight)).map(x=>x.name);
 let o=document.getElementById("finishSummary");
 o.innerHTML=`<div class="finishCard"><div class="finishCheck">✓</div><div class="eyebrow">WORKOUT COMPLETE</div><h2>${d.day} — ${d.name}</h2><div class="summaryGrid"><div><span>Total</span><b>${fmt(total/1000)}</b></div><div><span>Rest</span><b>${fmt(rest/1000)}</b></div><div><span>Active</span><b>${fmt(active/1000)}</b></div></div>${prs.length?`<div class="prSummary">🏆 ${prs.length} new PR${prs.length>1?"s":""}: ${prs.join(", ")}</div>`:""}<button onclick="closeFinish()">Done</button></div>`;
 o.classList.remove("hidden");
}
function closeFinish(){document.getElementById("finishSummary").classList.add("hidden");renderDay()}
renderWeeks();
