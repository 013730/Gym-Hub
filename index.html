<div class="wrap">

</div><script>
const KEY="gymhub-v6";
function ex(name,sets,reps,weight=""){return{name,sets,reps,weight,done:false,tallies:Array.from({length:sets},()=>Array(reps).fill(false))}}
function template(){
return[
{day:"Tuesday",name:"Leg Power",exercises:[ex("Barbell Squat",5,5,60),ex("Hip Thrust",5,5),ex("Deadlift",5,5),ex("Bulgarian Split Squat",5,5)]},
{day:"Wednesday",name:"Chest, Triceps & Shoulders",exercises:[ex("Bench Press",5,10),ex("Triceps Extension",5,10),ex("Cable Triceps Extension (Rope)",5,12),ex("Dumbbell Fly",5,12)]},
{day:"Thursday",name:"Arms & Shoulders",exercises:[]}
]}
function migrateOldGymData(){
 const keys=["gymhub-v6","allen-gym-hub-v2","gymhub-w1-tue-legpower-v1"];
 let best=null,bestScore=-1,source="";
 keys.forEach(k=>{
   try{
     let raw=localStorage.getItem(k);if(!raw)return;
     let obj=JSON.parse(raw),score=0;
     if(obj&&Array.isArray(obj.weeks)){
       obj.weeks.forEach(w=>w.days&&w.days.forEach(d=>d.exercises&&d.exercises.forEach(e=>{score+=1;if(e.weight!==""&&e.weight!=null)score+=2;if(e.done)score+=1})));
     } else if(Array.isArray(obj)) score=obj.length;
     if(score>bestScore){best=obj;bestScore=score;source=k}
   }catch(e){}
 });
 if(!best)return null;
 if(Array.isArray(best)){ // earliest single Tuesday workout format
   let days=template();
   days[0].exercises.forEach((e,i)=>{let o=best[i];if(o){e.weight=o.weight??e.weight;e.done=!!o.done;if(e.done)e.tallies=e.tallies.map(s=>s.map(()=>true))}});
   best={weeks:[{number:1,days}]};
 }
 // normalize all old exercises to current tally structure
 if(best.weeks)best.weeks.forEach(w=>{
   let fresh=template();
   ["Tuesday","Wednesday","Thursday"].forEach(dayName=>{
     let d=w.days?.find(x=>x.day===dayName);
     if(!d){w.days=w.days||[];w.days.push(fresh.find(x=>x.day===dayName));return}
     // fill missing standard exercises for Tue/Wed
     let fd=fresh.find(x=>x.day===dayName);
     fd.exercises.forEach(fe=>{
       let e=d.exercises?.find(x=>x.name===fe.name);
       if(!e){d.exercises=d.exercises||[];d.exercises.push(fe);return}
       e.sets=Number(e.sets)||fe.sets;e.reps=Number(e.reps)||fe.reps;
       if(!Array.isArray(e.tallies)||e.tallies.length!==e.sets)e.tallies=Array.from({length:e.sets},()=>Array(e.reps).fill(!!e.done));
     });
   });
 });
 localStorage.setItem("gymhub-migration-source",source);
 return best;
}
let data=JSON.parse(localStorage.getItem(KEY)||"null")||migrateOldGymData()||{weeks:[{number:1,days:template()}]};
localStorage.setItem(KEY,JSON.stringify(data));
let currentWeek=1,currentDay=0,timers={};

function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`}

function updateSessionTimer(){let total=session.elapsed+(session.running?Date.now()-session.start:0);let rest=session.restAccum+(session.restStart!==null?Date.now()-session.restStart:0);rest=Math.min(rest,total);let active=Math.max(0,total-rest);let vals=[["totalWorkoutTime",total],["totalWorkoutSmall",total],["totalRestTime",rest],["activeWorkoutTime",active]];vals.forEach(([id,ms])=>{let e=document.getElementById(id);if(e)e.textContent=fmt(ms/1000)});let b=document.getElementById("sessionStartBtn");if(b)b.textContent=session.running?"Pause":"Start";applyTimerLockUI();}
let build={running:false,start:0,elapsed:0};
function toggleBuild(){if(build.running){build.elapsed+=Date.now()-build.start;build.running=false}else if(build.elapsed<300000){build.start=Date.now();build.running=true}updateBuild()}

function updateBuild(){let ms=build.elapsed+(build.running?Date.now()-build.start:0);ms=Math.min(ms,300000);if(ms>=300000)build.running=false;let sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60;let t=document.getElementById("buildTime");if(t)t.textContent=`${m}:${String(s).padStart(2,"0")}`;let f=document.getElementById("buildFill");if(f)f.style.width=(ms/300000*100)+"%";let b=document.getElementById("buildBtn");if(b)b.textContent=build.running?"Pause":(ms>=300000?"Max reached":"Start")}
setInterval(updateBuild,250);

renderWeeks();show("home")}

function addWeek(){let n=data.weeks.length?Math.max(...data.weeks.map(w=>w.number))+1:1;data.weeks.push({number:n,days:template()});save();openWeek(n)}
function openWeek(n){currentWeek=n;let w=data.weeks.find(x=>x.number===n);document.getElementById("weekTitle").textContent=`Week ${n}`;let e=document.getElementById("days");e.innerHTML="";w.days.forEach((d,i)=>{let done=d.exercises.filter(x=>x.done).length;c=document.createElement("div");let full=d.exercises.length>0&&done===d.exercises.length;c.className="day"+(full?" dayComplete":"");c.onclick=()=>openDay(i);c.innerHTML=full?`<div class="completeGlow"><span>✓</span> WORKOUT COMPLETE</div><div class="eyebrow">${d.day.toUpperCase()}</div><div class="dayTitleRow"><h3>${d.name}</h3><div class="bigTick">✓</div></div><div class="completeMeta">${done} / ${d.exercises.length} exercises • DONE</div>`:`<div class="eyebrow">${d.day.toUpperCase()}</div><h3>${d.name}</h3><div class="muted">${d.exercises.length?done+" / "+d.exercises.length+" exercises complete":"Exercises to be added"} →</div>`;e.appendChild(c)});show("weekPage")}
function getDay(){return data.weeks.find(x=>x.number===currentWeek).days[currentDay]}

/* v1.3 — every WEEK + DAY has its own independent timer data */
function sessionKeyFor(week=currentWeek,day=currentDay){

}

/* v1.1 — finishing a workout freezes the session timer at that exact moment */
function freezeFinishedSession(){
  const now=Date.now();

  /* Add the final live slice to the saved total before stopping. */
  if(session.running && session.start!==null){
    session.elapsed += Math.max(0, now-session.start);
    session.start = null;
  }

  /* If a rest is currently running, capture it at the same finish moment. */
  if(session.restStart!==null){
    session.restAccum += Math.max(0, now-session.restStart);
    session.restStart = null;
  }

  session.running=false;
  saveSession();
  updateSessionTimer();
}

/* v2.0 — collapsed exercise cards accurately summarise mixed set weights/reps */
function compactSetRanges(values, suffix){
 const groups=[];
 values.forEach((v,i)=>{
   const val=(v===undefined||v===null||v==="")?"—":String(v);
   const last=groups[groups.length-1];
   if(last && last.value===val && last.end===i-1) last.end=i;
   else groups.push({value:val,start:i,end:i});
 });
 return groups.map(g=>{
   const label=g.start===g.end?`Set ${g.start+1}`:`Sets ${g.start+1}–${g.end+1}`;
   return `${label}: ${g.value}${suffix}`;
 }).join(" • ");
}
function collapsedExerciseSummary(x){
 const count=x.tallies.length;
 const reps=Array.from({length:count},(_,i)=>{
   const v=Array.isArray(x.setReps)?x.setReps[i]:null;
   return (v===null||v===undefined||v==="")?x.reps:v;
 });
 const weights=Array.from({length:count},(_,i)=>{
   const v=Array.isArray(x.setWeights)?x.setWeights[i]:null;
   return (v===null||v===undefined||v==="")?x.weight:v;
 });

 const sameReps=reps.every(v=>String(v)===String(reps[0]));
 const sameWeights=weights.every(v=>String(v)===String(weights[0]));

 if(sameReps && sameWeights)
   return `<span class="summaryMain">${count} sets × ${reps[0]} reps${weights[0]!==""?` • ${weights[0]} kg`:""}</span>`;

 let html=`<span class="summaryMain">${count} sets${sameReps?` × ${reps[0]} reps`:""}</span>`;
 if(!sameWeights){
   html+=`<span class="summaryBreakdown">${compactSetRanges(weights," kg").split(" • ").map(part=>{
     const m=part.match(/^(Sets? [^:]+):\s*(.+)$/);
     return m?`<span class="weightStat"><span class="weightStatLabel">${m[1]}</span><span class="weightStatValue">${m[2]}</span></span>`:`<span class="weightStat"><span class="weightStatValue">${part}</span></span>`;
   }).join('<span class="weightDivider"></span>')}</span>`;
 }else if(weights[0]!==""){
   html+=`<span class="summaryBreakdown">${weights[0]} kg</span>`;
 }
 if(!sameReps){
   html+=`<span class="summaryBreakdown repsBreakdown">${compactSetRanges(reps," reps")}</span>`;
 }
 return html;
}

const V6_TIME_KEY="gymhub-v6-day-times";
function v6Times(){try{return JSON.parse(localStorage.getItem(V6_TIME_KEY)||"{}")}catch(_){return{}}}
function v6SaveTimes(x){localStorage.setItem(V6_TIME_KEY,JSON.stringify(x))}
function v6Key(wi,di){return wi+"-"+di}
function v6Fmt(sec){
 sec=Math.max(0,Math.floor(sec||0));
 const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),z=sec%60;
 return h?`${h}:${String(m).padStart(2,"0")}:${String(z).padStart(2,"0")}`:`${m}:${String(z).padStart(2,"0")}`;
}
function v6ReadDisplayedSeconds(selector){
 const el=document.querySelector(selector); if(!el)return 0;
 const p=(el.textContent||"0:00").trim().split(":").map(Number);
 if(p.length===3)return p[0]*3600+p[1]*60+p[2];
 return (p[0]||0)*60+(p[1]||0);
}
function v6StoreCurrentDayTime(){
 if(typeof currentWeek!=="number"||typeof currentDay!=="number")return;
 const t=v6Times(),k=v6Key(currentWeek,currentDay);
 t[k]={
   total:v6ReadDisplayedSeconds(".timerbig,.timer-time,#timerDisplay,#sessionTime"),
   rest:v6ReadDisplayedSeconds("[data-total-rest],#totalRest,.total-rest")
 };
 v6SaveTimes(t);
}

/* Stop timer on confirmed All Done by using the existing pause control if currently running. */
document.addEventListener("click",function(e){
 const b=e.target.closest("button");if(!b)return;
 const txt=(b.textContent||"").trim().toLowerCase();
 if(txt.includes("all done")){
   setTimeout(function(){
     try{
       v6StoreCurrentDayTime();
       const pause=[...document.querySelectorAll("button")].find(x=>(x.textContent||"").toLowerCase().includes("start / pause"));
       /* existing V4 timer owns its state; only click pause if its visible session time is actively changing */
       if(pause && typeof updateSessionTimer==="function"){
         /* call original toggle only when app exposes running flag */
         if(typeof timerRunning!=="undefined" && timerRunning) pause.click();
       }
       v6DecorateWeek();
     }catch(_){}
   },250);
 }
},true);

/* Week-screen final Total/Rest time labels. */
function v6DecorateWeek(){
 const t=v6Times();
 const rows=[...document.querySelectorAll(".dayrow")];
 rows.forEach((row,i)=>{
   let wi=0;
   const card=row.closest("[data-week]");
   if(card && card.dataset.week!=null) wi=Number(card.dataset.week);
   const rec=t[v6Key(wi,i)];
   let x=row.querySelector(".v6-day-times");
   if(rec){
     if(!x){x=document.createElement("div");x.className="v6-day-times";row.appendChild(x)}
     x.textContent="Total "+v6Fmt(rec.total)+" • Rest "+v6Fmt(rec.rest);
   }else if(x)x.remove();
 });
}

/* Add Not done? beside completed exercises without changing V4 card layout. */
function v6ExerciseNotDone(){
 const day=data.weeks?.[currentWeek]?.days?.[currentDay];
 if(!day||!Array.isArray(day.exercises))return;
 const cards=[...document.querySelectorAll(".exercise")];
 cards.forEach((card,i)=>{
   const ex=day.exercises[i];if(!ex)return;
   const sets=Array.isArray(ex.sets)?ex.sets:[];
   const done=sets.length>0 && sets.every(st=>st && (st.done===true||st.completed===true));
   let btn=card.querySelector(".v6-notdone");
   if(done && !btn){
     btn=document.createElement("button");btn.type="button";btn.className="v6-notdone";btn.textContent="Not done?";
     btn.onclick=function(ev){
       ev.stopPropagation();
       if(!confirm("Mark this exercise as not done so you can redo it?"))return;
       sets.forEach(st=>{if(st&&typeof st==="object"){if("done" in st)st.done=false;if("completed" in st)st.completed=false}});
       if("done" in ex)ex.done=false;if("completed" in ex)ex.completed=false;
       commitSave();renderDay();
     };
     const edit=card.querySelector("button");
     if(edit)edit.insertAdjacentElement("afterend",btn);else card.appendChild(btn);
   } else if(!done && btn) btn.remove();
 });
}

/* Completed DAY can also be reopened from week screen. */
function v6DayNotDone(){
 document.querySelectorAll(".dayrow").forEach((row,di)=>{
   const txt=(row.textContent||"").toLowerCase();
   const complete=txt.includes("done")||txt.includes("workout complete");
   if(!complete||row.querySelector(".v6-day-notdone"))return;
   const b=document.createElement("button");b.type="button";b.className="v6-notdone v6-day-notdone";b.textContent="Not done?";
   b.onclick=function(e){
     e.preventDefault();e.stopPropagation();
     if(!confirm("Reopen this workout and mark it as not done?"))return;
     const week=data.weeks?.[0],day=week?.days?.[di];
     if(day){
       if("done" in day)day.done=false;if("completed" in day)day.completed=false;
       commitSave();renderWeeks();
     }
   };
   row.appendChild(b);
 });
}

const v6RenderDay=renderDay;
renderDay=function(){const r=v6RenderDay.apply(this,arguments);requestAnimationFrame(v6ExerciseNotDone);return r};
const v6RenderWeeks=renderWeeks;
renderWeeks=function(){const r=v6RenderWeeks.apply(this,arguments);requestAnimationFrame(()=>{v6DecorateWeek();v6DayNotDone()});return r};

/* V9: simple ☐ Not done <-> ✓ Done toggle. No workout data is erased. */
function v9DayComplete(day){
  if(!day)return false;
  if(day.v9ManualDone===true)return true;
  if(day.v9ManualDone===false)return false;
  if(day.done===true||day.completed===true||day.isDone===true||day.workoutComplete===true)return true;
  if(Array.isArray(day.exercises)&&day.exercises.length){
    return day.exercises.every(ex=>{
      const sets=Array.isArray(ex.sets)?ex.sets:[];
      return sets.length>0 && sets.every(st=>st&&(st.done===true||st.completed===true));
    });
  }
  return false;
}
function v9CompletionToggle(){
  const day=data.weeks?.[currentWeek]?.days?.[currentDay];
  const page=document.getElementById("dayPage");
  if(!day||!page)return;
  let b=page.querySelector(".v9-done-toggle");
  if(!b){
    b=document.createElement("button");
    b.type="button"; b.className="v9-done-toggle";
    page.appendChild(b);
    b.onclick=function(e){
      e.preventDefault();e.stopPropagation();
      day.v9ManualDone=!v9DayComplete(day);
      /* Update only completion status. Weights/reps/sets/times are untouched. */
      if("done" in day)day.done=day.v9ManualDone;
      if("completed" in day)day.completed=day.v9ManualDone;
      if("isDone" in day)day.isDone=day.v9ManualDone;
      if("workoutComplete" in day)day.workoutComplete=day.v9ManualDone;
      commitSave();
      v9CompletionToggle();
      try{renderWeeks()}catch(_){}
    };
  }
  const done=v9DayComplete(day);
  b.textContent=done?"✓ Done":"☐ Not done";
  b.classList.toggle("is-done",done);
  b.classList.toggle("is-notdone",!done);
}
const v9RenderDay=renderDay;
renderDay=function(){
  const r=v9RenderDay.apply(this,arguments);
  requestAnimationFrame(v9CompletionToggle);
  return r;
};
requestAnimationFrame(function(){try{v9CompletionToggle()}catch(_){}});

/* V2: put Not done directly on the actual completed cards on Week screen. */
function v2WeekNotDoneButtons(){
  const weekIndex=(typeof currentWeek==="number" ? currentWeek : 0);
  const week=data.weeks?.[weekIndex];
  if(!week||!Array.isArray(week.days))return;

  /* Original Week screen day cards are identified by their visible weekday text,
     avoiding assumptions about one specific CSS class. */
  const candidates=[...document.querySelectorAll("div,article,section")];
  week.days.forEach((day,di)=>{
    if(!day)return;
    const dayName=String(day.day||day.name||day.label||["Tuesday","Wednesday","Thursday"][di]||"").toLowerCase();
    if(!dayName)return;

    const card=candidates
      .filter(el=>{
        const txt=(el.textContent||"").toLowerCase();
        return txt.includes(dayName) && txt.includes("workout complete") && txt.includes("done");
      })
      .sort((a,b)=>a.querySelectorAll("*").length-b.querySelectorAll("*").length)[0];

    if(!card||card.querySelector(".v2-week-notdone"))return;

    const b=document.createElement("button");
    b.type="button";
    b.className="v2-week-notdone";
    b.textContent="☐ Not done";
    b.onclick=function(e){
      e.preventDefault();e.stopPropagation();

      /* Only change completion state. Preserve kg, reps, sets and timer records. */
      day.v9ManualDone=false;
      ["done","completed","isDone","workoutComplete"].forEach(k=>{
        if(k in day)day[k]=false;
      });

      commitSave();
      renderWeeks();
    };
    card.appendChild(b);
  });
}

const v2OriginalRenderWeeks=renderWeeks;
renderWeeks=function(){
  const r=v2OriginalRenderWeeks.apply(this,arguments);
  requestAnimationFrame(v2WeekNotDoneButtons);
  return r;
};
requestAnimationFrame(v2WeekNotDoneButtons);
</script>



<script>
/* v0.1 Home header polish: GYM HUB + subtle version only. */
(function(){
  function polishHome(){
    const home=document.getElementById("homePage") ||
      [...document.querySelectorAll("main,section,div")].find(el=>{
        const t=(el.innerText||"").trim();
        return /^GYM HUB\b/i.test(t) && /Week 1|Add Week/i.test(t);
      });
    if(!home)return;
    home.classList.add("v01-home-clean");

    const h=[...home.querySelectorAll("h1")].find(x=>/GYM HUB/i.test(x.textContent||""));
    if(h && !h.closest(".v01-brandline")){
      h.textContent="GYM HUB";
      const line=document.createElement("div"); line.className="v01-brandline";
      h.parentNode.insertBefore(line,h);
      line.appendChild(h);
      const v=document.createElement("span");v.className="v01-version";v.textContent="v2.4";
      line.appendChild(v);
    }

    /* Remove only the explanatory home subtitle; week content remains untouched. */
    [...home.querySelectorAll("p,div")].forEach(el=>{
      if((el.textContent||"").trim().toLowerCase()==="choose a week or add your next training week."){
        el.style.display="none";
      }
    });
  }
  const obs=new MutationObserver(()=>requestAnimationFrame(polishHome));
  obs.observe(document.body,{childList:true,subtree:true});
  requestAnimationFrame(polishHome);
})();
</script>


<script>
/* v0.3 exact Not Done fix using Gym Hub's original data model */
(function(){
  function installNotDone(){
    const week=data.weeks.find(w=>w.number===currentWeek);
    if(!week)return;

    const daysContainer=document.getElementById("days");
    if(!daysContainer)return;

    [...daysContainer.children].forEach((card,index)=>{
      const day=week.days[index];
      if(!day || !day.exercises?.length)return;

      const full=day.exercises.every(x=>x.done===true);
      let btn=card.querySelector(".v03-notdone");

      if(full && !btn){
        btn=document.createElement("button");
        btn.type="button";
        btn.className="v03-notdone";
        btn.textContent="☐ Not done";

        btn.onclick=function(e){
          e.preventDefault();
          e.stopPropagation();

          if(!confirm("Mark this workout as not done? Your weights and workout data will stay saved."))return;

          /* This is exactly what the original app uses for completion:
             exercise.done + each exercise's tallies.
             Reset ONLY completion ticks. Keep weight, reps, names, sets, etc. */
          day.exercises.forEach(ex=>{
            ex.done=false;
            if(Array.isArray(ex.tallies)){
              ex.tallies=ex.tallies.map(set=>Array.isArray(set)?set.map(()=>false):set);
            }
          });

          save();       // original app save function
          openWeek(currentWeek); // original renderer rebuilds normal incomplete cards
        };

        card.appendChild(btn);
      } else if(!full && btn){
        btn.remove();
      }
    });
  }

  /* Wrap the actual function that renders the Week screen. */
  const originalOpenWeek=openWeek;
  openWeek=function(n){
    originalOpenWeek(n);
    requestAnimationFrame(installNotDone);
  };

  requestAnimationFrame(installNotDone);
})();
</script>



<script>
/* v0.5 — rest timer has no maximum.
   It keeps counting indefinitely; 3:00 remains the minimum guidance. */
(function(){
  function cleanRestLabels(){
    document.querySelectorAll("body *").forEach(el=>{
      if(el.children.length) return;
      const t=(el.textContent||"").trim();
      if(/Build up to 3:00 minimum/i.test(t) && /max/i.test(t)){
        el.textContent="Build up to 3:00 minimum";
      } else if(/Build up to 3:00 minimum/i.test(t) && /max/i.test(t)){
        /* Existing workout UI showed 3:30; user requested 3:00 minimum. */
        el.textContent="Build up to 3:00 minimum";
      }
    });
  }

  /* Prevent any legacy 5-minute auto-stop/reset behaviour if it exists.
     The visible rest timer remains driven by the app's normal elapsed-time clock. */
  const mo=new MutationObserver(()=>requestAnimationFrame(cleanRestLabels));
  mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  requestAnimationFrame(cleanRestLabels);
})();
</script>

<script>
/* v0.7 cleanup — exactly ONE weight row per set.
   Removes any legacy injected rows if an old cached DOM ever contains them. */
(function(){
  function clean(){
    document.querySelectorAll(".set").forEach(set=>{
      const direct=[...set.children].filter(x=>x.classList && x.classList.contains("setWeightLine"));
      direct.slice(1).forEach(x=>x.remove());
      set.querySelectorAll(".v04-weight-row,.v06-weight-row").forEach(x=>x.remove());
    });
  }
  const mo=new MutationObserver(()=>requestAnimationFrame(clean));
  mo.observe(document.body,{childList:true,subtree:true});
  requestAnimationFrame(clean);
})();
</script>
